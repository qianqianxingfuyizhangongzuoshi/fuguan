<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>倩倩幸福驿站工作室 - 顾客消费管理</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
    min-height: 100vh;
  }
  /* 顶部导航 */
  .topbar {
    background: linear-gradient(135deg, #ff6b9d, #c471ed);
    color: white;
    padding: 18px 16px 14px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(196, 113, 237, 0.3);
  }
  .topbar h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }
  .topbar p {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 4px;
  }
  .topbar .owner-btn {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255,255,255,0.2);
    border: 1px solid rgba(255,255,255,0.4);
    color: white;
    font-size: 12px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
  }

  /* 视图切换 */
  .view { display: none; }
  .view.active { display: block; }

  /* 搜索页 */
  .search-box {
    background: white;
    margin: 16px;
    border-radius: 16px;
    padding: 24px 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    text-align: center;
  }
  .search-box h2 {
    font-size: 20px;
    margin-bottom: 6px;
    color: #c471ed;
  }
  .search-box p {
    font-size: 13px;
    color: #999;
    margin-bottom: 20px;
  }
  .search-box input {
    width: 100%;
    padding: 14px 16px;
    font-size: 16px;
    border: 2px solid #eee;
    border-radius: 12px;
    outline: none;
    transition: border-color 0.3s;
    text-align: center;
  }
  .search-box input:focus { border-color: #c471ed; }
  .search-btn {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    background: linear-gradient(135deg, #ff6b9d, #c471ed);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
  }
  .search-btn:active { opacity: 0.85; }

  /* 顾客面板 */
  .customer-panel {
    padding: 16px;
    max-width: 600px;
    margin: 0 auto;
  }
  .customer-header {
    background: linear-gradient(135deg, #ff6b9d, #c471ed);
    color: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
    position: relative;
  }
  .customer-name {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .customer-subtitle {
    font-size: 12px;
    opacity: 0.85;
  }
  .back-btn {
    position: absolute;
    right: 16px;
    top: 16px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 20px;
    cursor: pointer;
  }

  /* 消费总览卡片 */
  .overview-cards {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 14px;
  }
  .overview-card {
    background: white;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .overview-card .num {
    font-size: 22px;
    font-weight: 700;
    color: #c471ed;
  }
  .overview-card .num.green { color: #4caf50; }
  .overview-card .num.red { color: #ff6b9d; }
  .overview-card .label {
    font-size: 11px;
    color: #999;
    margin-top: 4px;
  }

  /* 调理进度 */
  .section-title {
    font-size: 14px;
    font-weight: 600;
    color: #888;
    margin: 16px 0 10px;
    padding-left: 4px;
  }
  .progress-card {
    background: white;
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .progress-card h3 {
    font-size: 15px;
    color: #333;
    margin-bottom: 10px;
  }
  .progress-bar-wrap {
    background: #f0f0f0;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .progress-bar {
    height: 100%;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff6b9d, #c471ed);
    transition: width 0.5s;
  }
  .progress-desc {
    font-size: 12px;
    color: #999;
    text-align: right;
  }

  /* 消费记录 */
  .record-item {
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .record-left .record-date {
    font-size: 11px;
    color: #bbb;
    margin-bottom: 3px;
  }
  .record-left .record-product {
    font-size: 14px;
    font-weight: 600;
    color: #333;
    margin-bottom: 3px;
  }
  .record-left .record-note {
    font-size: 12px;
    color: #999;
  }
  .record-right {
    text-align: right;
    flex-shrink: 0;
    margin-left: 12px;
  }
  .record-amount {
    font-size: 16px;
    font-weight: 700;
    color: #ff6b9d;
  }
  .record-balance {
    font-size: 11px;
    color: #4caf50;
    margin-top: 3px;
  }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #ccc;
  }
  .empty-state .icon {
    font-size: 48px;
    margin-bottom: 12px;
  }

  /* ===== 老板管理视图 ===== */
  .owner-panel { padding: 16px; max-width: 700px; margin: 0 auto; }
  .owner-panel .section-title { font-size: 16px; margin: 20px 0 12px; }

  /* Tab 切换 */
  .tab-bar {
    display: flex;
    background: white;
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .tab-btn {
    flex: 1;
    text-align: center;
    padding: 10px;
    font-size: 13px;
    border: none;
    background: none;
    color: #999;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, #ff6b9d, #c471ed);
    color: white;
  }

  /* 顾客列表 */
  .customer-list-item {
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    cursor: pointer;
    transition: box-shadow 0.2s;
  }
  .customer-list-item:active { box-shadow: none; }
  .cli-left .cli-name { font-size: 15px; font-weight: 600; color: #333; }
  .cli-left .cli-meta { font-size: 12px; color: #bbb; margin-top: 3px; }
  .cli-right { text-align: right; }
  .cli-right .cli-total { font-size: 14px; font-weight: 700; color: #c471ed; }
  .cli-right .cli-date { font-size: 11px; color: #bbb; margin-top: 3px; }

  /* 表单 */
  .form-card {
    background: white;
    border-radius: 16px;
    padding: 20px 16px;
    margin-bottom: 14px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .form-row {
    margin-bottom: 14px;
  }
  .form-row label {
    display: block;
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .form-row input, .form-row textarea, .form-row select {
    width: 100%;
    padding: 11px 14px;
    font-size: 14px;
    border: 1.5px solid #eee;
    border-radius: 10px;
    outline: none;
    font-family: inherit;
    transition: border-color 0.3s;
  }
  .form-row input:focus, .form-row textarea:focus, .form-row select:focus {
    border-color: #c471ed;
  }
  .form-row textarea { resize: vertical; min-height: 60px; }

  .btn-primary {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff6b9d, #c471ed);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary:active { opacity: 0.85; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-secondary {
    width: 100%;
    padding: 11px;
    background: white;
    color: #c471ed;
    border: 1.5px solid #c471ed;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  .btn-secondary:active { background: #f9f0ff; }

  /* 编辑/查看消费记录列表 */
  .record-edit-item {
    background: white;
    border-radius: 14px;
    padding: 12px 16px;
    margin-bottom: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .record-edit-item .rei-info .rei-date { font-size: 11px; color: #bbb; margin-bottom: 2px; }
  .record-edit-item .rei-info .rei-product { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 2px; }
  .record-edit-item .rei-info .rei-amount { font-size: 13px; color: #ff6b9d; font-weight: 600; }
  .record-edit-item .rei-info .rei-balance { font-size: 11px; color: #4caf50; }
  .record-edit-item .rei-actions { display: flex; gap: 6px; }
  .record-edit-item .edit-btn, .record-edit-item .del-btn {
    border: none;
    border-radius: 8px;
    font-size: 12px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .record-edit-item .edit-btn { background: #f0e6ff; color: #c471ed; }
  .record-edit-item .del-btn { background: #ffe6ee; color: #ff6b9d; }

  /* 顾客详情 */
  .customer-detail-header {
    background: linear-gradient(135deg, #ff6b9d, #c471ed);
    color: white;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 14px;
  }
  .cdh-name { font-size: 20px; font-weight: 700; }
  .cdh-meta { font-size: 12px; opacity: 0.8; margin-top: 4px; }

  /* 模态框 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: white;
    border-radius: 20px 20px 0 0;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 24px 20px 40px;
  }
  .modal-title {
    font-size: 17px;
    font-weight: 700;
    color: #333;
    text-align: center;
    margin-bottom: 20px;
  }
  .modal-close {
    width: 100%;
    padding: 12px;
    background: #f5f5f5;
    color: #888;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 10px;
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.75);
    color: white;
    padding: 10px 24px;
    border-radius: 30px;
    font-size: 14px;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; }

  /* 底部安全区 */
  .safe-bottom { height: env(safe-area-inset-bottom, 20px); }

  /* 汇总统计 */
  .stat-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }
  .stat-box {
    flex: 1;
    background: white;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
  }
  .stat-box .snum { font-size: 20px; font-weight: 700; color: #c471ed; }
  .stat-box .snum.green { color: #4caf50; }
  .stat-box .slabel { font-size: 11px; color: #999; margin-top: 4px; }

  /* 切换入口 */
  .switch-hint {
    text-align: center;
    font-size: 12px;
    color: #bbb;
    padding: 10px 0 4px;
  }

  /* 进度标签 */
  .progress-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .progress-tag {
    background: #f0e6ff;
    color: #c471ed;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
  }
</style>
</head>
<body>

<!-- ===== 顶部导航 ===== -->
<div class="topbar" id="topbar">
  <h1>倩倩幸福驿站工作室</h1>
  <p id="topbarSub">顾客消费管理</p>
  <button class="owner-btn" id="ownerBtn" onclick="goOwner()">📋 管理</button>
</div>

<!-- ===== 搜索视图（顾客入口） ===== -->
<div class="view active" id="viewSearch">
  <div class="search-box">
    <h2>🔍 查找我的消费记录</h2>
    <p>输入您的姓名即可查看</p>
    <input type="text" id="searchName" placeholder="请输入您的姓名" maxlength="20">
    <button class="search-btn" onclick="searchCustomer()">查看我的消费</button>
  </div>
  <div class="switch-hint">你是店主？点右上角「管理」进入</div>
</div>

<!-- ===== 顾客面板视图 ===== -->
<div class="view" id="viewCustomer">
  <div class="customer-panel" id="customerPanel"></div>
</div>

<!-- ===== 老板管理视图 ===== -->
<div class="view" id="viewOwner">
  <div class="owner-panel">

    <!-- 统计卡片 -->
    <div class="stat-row">
      <div class="stat-box">
        <div class="snum" id="statCustomers">0</div>
        <div class="slabel">顾客总数</div>
      </div>
      <div class="stat-box">
        <div class="snum green" id="statRecords">0</div>
        <div class="slabel">消费记录</div>
      </div>
      <div class="stat-box">
        <div class="snum" id="statRevenue">¥0</div>
        <div class="slabel">总收入</div>
      </div>
    </div>

    <!-- Tab -->
    <div class="tab-bar">
      <button class="tab-btn active" onclick="switchTab('list')" id="tabList">👥 顾客列表</button>
      <button class="tab-btn" onclick="switchTab('add')" id="tabAdd">➕ 录入消费</button>
      <button class="tab-btn" onclick="switchTab('records')" id="tabRecords">📋 记录管理</button>
    </div>

    <!-- 顾客列表 -->
    <div id="tabContentList"></div>

    <!-- 录入表单 -->
    <div id="tabContentAdd" style="display:none">
      <div class="form-card">
        <div class="form-row">
          <label>顾客姓名 *</label>
          <input type="text" id="fName" placeholder="输入顾客姓名" maxlength="20">
        </div>
        <div class="form-row">
          <label>消费项目 *</label>
          <input type="text" id="fProduct" placeholder="例如：AI体脂检测 + 跃莱产品套餐" maxlength="100">
        </div>
        <div class="form-row">
          <label>消费金额（元）*</label>
          <input type="number" id="fAmount" placeholder="0" min="0" step="0.01">
        </div>
        <div class="form-row">
          <label>剩余次数/余额（选填）</label>
          <input type="text" id="fBalance" placeholder="例如：剩余8次 / 余额¥200 / 已完成" maxlength="50">
        </div>
        <div class="form-row">
          <label>调理进度（%）</label>
          <input type="number" id="fProgress" placeholder="0-100，例如60" min="0" max="100" value="0">
        </div>
        <div class="form-row">
          <label>到店日期</label>
          <input type="date" id="fDate">
        </div>
        <div class="form-row">
          <label>备注</label>
          <textarea id="fNote" placeholder="可选：补充说明" maxlength="200"></textarea>
        </div>
        <button class="btn-primary" onclick="addRecord()">💾 保存记录</button>
      </div>
    </div>

    <!-- 记录管理（编辑/删除所有记录） -->
    <div id="tabContentRecords" style="display:none">
      <div id="recordsList"></div>
    </div>

  </div>
</div>

<!-- ===== 顾客详情视图（管理内） ===== -->
<div class="view" id="viewCustomerDetail">
  <div class="owner-panel" id="customerDetailPanel"></div>
</div>

<!-- ===== 模态框 ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <div class="modal-title" id="modalTitle">编辑</div>
    <div id="modalContent"></div>
    <button class="modal-close" onclick="closeModal()">取消</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ========== 数据层 ==========
const DB_KEY = 'qianqian_customers_v1';

function getDB() {
  const raw = localStorage.getItem(DB_KEY);
  return raw ? JSON.parse(raw) : {};
}

function saveDB(db) {
  localStorage.setItem(DB_KEY, JSON.stringify(db));
}

// ========== 工具 ==========
function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

function todayStr() { return formatDate(new Date()); }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function switchView(id) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// 搜索顾客（扫码入口）
function searchCustomer() {
  const name = document.getElementById('searchName').value.trim();
  if (!name) { showToast('请输入您的姓名'); return; }
  const db = getDB();
  const key = Object.keys(db).find(k => k.includes(name));
  if (!key) {
    showToast('未找到「' + name + '」的记录');
    return;
  }
  renderCustomerPanel(key, db[key]);
  switchView('viewCustomer');
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('ownerBtn').style.display = 'none';
}

// 顾客面板（只读）
function renderCustomerPanel(name, data) {
  const totalAmount = data.records.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  const card = document.getElementById('customerPanel');
  let html = `
    <div class="customer-header">
      <div class="customer-name">${name}</div>
      <div class="customer-subtitle">倩倩幸福驿站 · 顾客档案</div>
      <button class="back-btn" onclick="backFromCustomer()">← 返回</button>
    </div>
    <div class="overview-cards">
      <div class="overview-card">
        <div class="num">¥${totalAmount.toFixed(0)}</div>
        <div class="label">累计消费</div>
      </div>
      <div class="overview-card">
        <div class="num green">${data.records.length}</div>
        <div class="label">到店次数</div>
      </div>
      <div class="overview-card">
        <div class="num">${data.progress || 0}%</div>
        <div class="label">调理进度</div>
      </div>
    </div>
  `;

  if (data.records.length > 0) {
    const latest = data.records[data.records.length - 1];
    if (latest.balance) {
      html += `
        <div class="progress-card">
          <h3>📌 最新状态</h3>
          <div style="font-size:14px;color:#666;">${latest.balance}</div>
          ${data.progress !== undefined ? `
          <div class="progress-bar-wrap" style="margin-top:12px">
            <div class="progress-bar" style="width:${data.progress}%"></div>
          </div>
          <div class="progress-desc">调理进度：${data.progress}%</div>` : ''}
        </div>
      `;
    }
  }

  html += `<div class="section-title">📋 消费记录（共${data.records.length}条）</div>`;

  if (data.records.length === 0) {
    html += `<div class="empty-state"><div class="icon">📭</div><p>暂无消费记录</p></div>`;
  } else {
    const sorted = [...data.records].reverse();
    for (const r of sorted) {
      html += `
        <div class="record-item">
          <div class="record-left">
            <div class="record-date">${r.date || '—'}</div>
            <div class="record-product">${r.product || r.item || '—'}</div>
            ${r.note ? `<div class="record-note">${r.note}</div>` : ''}
          </div>
          <div class="record-right">
            <div class="record-amount">¥${parseFloat(r.amount || 0).toFixed(2)}</div>
            ${r.balance ? `<div class="record-balance">${r.balance}</div>` : ''}
          </div>
        </div>
      `;
    }
  }

  card.innerHTML = html;
}

function backFromCustomer() {
  document.getElementById('topbar').style.display = '';
  document.getElementById('ownerBtn').style.display = '';
  switchView('viewSearch');
  document.getElementById('searchName').value = '';
}

// ========== 老板管理 ==========
function goOwner() {
  switchView('viewOwner');
  document.getElementById('topbar').style.display = '';
  document.getElementById('ownerBtn').style.display = '';
  document.getElementById('topbarSub').textContent = '店主管理后台';
  renderOwner();
}

function goSearch() {
  switchView('viewSearch');
  document.getElementById('topbarSub').textContent = '顾客消费管理';
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
  document.getElementById('tabContentList').style.display = tab === 'list' ? '' : 'none';
  document.getElementById('tabContentAdd').style.display = tab === 'add' ? '' : 'none';
  document.getElementById('tabContentRecords').style.display = tab === 'records' ? '' : 'none';
  if (tab === 'list') renderCustomerList();
  if (tab === 'records') renderAllRecords();
}

function renderOwner() {
  renderCustomerList();
  updateStats();
}

function updateStats() {
  const db = getDB();
  const names = Object.keys(db);
  let totalRecords = 0, totalRevenue = 0;
  for (const n of names) {
    totalRecords += db[n].records.length;
    totalRevenue += db[n].records.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  }
  document.getElementById('statCustomers').textContent = names.length;
  document.getElementById('statRecords').textContent = totalRecords;
  document.getElementById('statRevenue').textContent = '¥' + totalRevenue.toFixed(0);
}

function renderCustomerList() {
  const db = getDB();
  const names = Object.keys(db);
  const container = document.getElementById('tabContentList');

  if (names.length === 0) {
    container.innerHTML = `
      <div class="empty-state"><div class="icon">👥</div><p>暂无顾客，点下方「录入消费」添加</p></div>
    `;
    return;
  }

  let html = '';
  for (const name of names.sort()) {
    const data = db[name];
    const total = data.records.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
    const lastDate = data.records.length > 0 ? data.records[data.records.length - 1].date : '—';
    html += `
      <div class="customer-list-item" onclick="openCustomerDetail('${name}')">
        <div class="cli-left">
          <div class="cli-name">${name}</div>
          <div class="cli-meta">${data.records.length}条消费记录 · 进度${data.progress || 0}%</div>
        </div>
        <div class="cli-right">
          <div class="cli-total">¥${total.toFixed(0)}</div>
          <div class="cli-date">${lastDate}</div>
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

// ========== 添加记录 ==========
function addRecord() {
  const name = document.getElementById('fName').value.trim();
  const product = document.getElementById('fProduct').value.trim();
  const amount = document.getElementById('fAmount').value.trim();
  const balance = document.getElementById('fBalance').value.trim();
  const progress = document.getElementById('fProgress').value.trim();
  const date = document.getElementById('fDate').value;
  const note = document.getElementById('fNote').value.trim();

  if (!name) { showToast('请输入顾客姓名'); return; }
  if (!product) { showToast('请输入消费项目'); return; }
  if (!amount || isNaN(amount) || parseFloat(amount) < 0) { showToast('请输入正确的金额'); return; }

  const db = getDB();
  if (!db[name]) db[name] = { records: [], progress: 0 };
  db[name].records.push({
    date: date || todayStr(),
    product,
    amount: parseFloat(amount),
    balance,
    note,
    id: Date.now()
  });
  if (progress !== '') db[name].progress = parseInt(progress) || 0;
  saveDB(db);

  // 清空表单
  document.getElementById('fProduct').value = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('fBalance').value = '';
  document.getElementById('fNote').value = '';
  document.getElementById('fDate').value = todayStr();
  // 保留姓名

  showToast('✅ 记录已保存');
  updateStats();
  renderCustomerList();
}

// ========== 记录管理（编辑/删除） ==========
function renderAllRecords() {
  const db = getDB();
  const container = document.getElementById('recordsList');
  const all = [];
  for (const name of Object.keys(db)) {
    for (const r of db[name].records) {
      all.push({ name, ...r });
    }
  }
  all.sort((a, b) => b.id - a.id);

  if (all.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📋</div><p>暂无记录</p></div>';
    return;
  }

  let html = '';
  for (const item of all) {
    html += `
      <div class="record-edit-item">
        <div class="rei-info">
          <div class="rei-date">${item.date} · ${item.name}</div>
          <div class="rei-product">${item.product}</div>
          <div class="rei-amount">¥${parseFloat(item.amount || 0).toFixed(2)}</div>
          ${item.balance ? `<div class="rei-balance">${item.balance}</div>` : ''}
        </div>
        <div class="rei-actions">
          <button class="edit-btn" onclick="editRecord('${item.name}', ${item.id})">✏️</button>
          <button class="del-btn" onclick="delRecord('${item.name}', ${item.id})">🗑️</button>
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

function editRecord(name, id) {
  const db = getDB();
  const r = db[name].records.find(r => r.id === id);
  if (!r) return;

  const content = `
    <div class="form-row">
      <label>消费项目</label>
      <input type="text" id="me_product" value="${r.product}">
    </div>
    <div class="form-row">
      <label>金额（元）</label>
      <input type="number" id="me_amount" value="${r.amount}" min="0" step="0.01">
    </div>
    <div class="form-row">
      <label>剩余次数/余额</label>
      <input type="text" id="me_balance" value="${r.balance || ''}">
    </div>
    <div class="form-row">
      <label>日期</label>
      <input type="date" id="me_date" value="${r.date}">
    </div>
    <div class="form-row">
      <label>备注</label>
      <textarea id="me_note">${r.note || ''}</textarea>
    </div>
    <button class="btn-primary" onclick="saveEditRecord('${name}', ${id})">💾 保存修改</button>
  `;
  openModal('编辑消费记录', content);
}

function saveEditRecord(name, id) {
  const db = getDB();
  const idx = db[name].records.findIndex(r => r.id === id);
  if (idx < 0) return;
  db[name].records[idx] = {
    ...db[name].records[idx],
    product: document.getElementById('me_product').value.trim(),
    amount: parseFloat(document.getElementById('me_amount').value) || 0,
    balance: document.getElementById('me_balance').value.trim(),
    date: document.getElementById('me_date').value,
    note: document.getElementById('me_note').value.trim()
  };
  saveDB(db);
  closeModal();
  renderAllRecords();
  updateStats();
  showToast('✅ 修改已保存');
}

function delRecord(name, id) {
  if (!confirm(`确定要删除 ${name} 的这条记录吗？`)) return;
  const db = getDB();
  db[name].records = db[name].records.filter(r => r.id !== id);
  if (db[name].records.length === 0) delete db[name];
  saveDB(db);
  renderAllRecords();
  updateStats();
  showToast('🗑️ 已删除');
}

// ========== 顾客详情（管理内） ==========
function openCustomerDetail(name) {
  const db = getDB();
  if (!db[name]) return;
  const data = db[name];
  switchView('viewCustomerDetail');
  const panel = document.getElementById('customerDetailPanel');
  const total = data.records.reduce((s, r) => s + (parseFloat(r.amount) || 0), 0);
  panel.innerHTML = `
    <div class="customer-detail-header">
      <div class="cdh-name">${name}</div>
      <div class="cdh-meta">倩倩幸福驿站 · 共${data.records.length}条记录 · 总消费¥${total.toFixed(0)}</div>
      <button class="back-btn" onclick="goOwner()" style="right:16px;top:16px">← 返回</button>
    </div>

    <div class="form-card">
      <div class="form-row" style="margin-bottom:8px">
        <label style="font-size:13px;color:#888;margin-bottom:4px">调理总进度</label>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="progress-bar-wrap" style="flex:1;margin:0">
            <div class="progress-bar" style="width:${data.progress || 0}%"></div>
          </div>
          <span style="font-size:13px;font-weight:700;color:#c471ed;width:40px;text-align:right">${data.progress || 0}%</span>
        </div>
      </div>
      <div class="form-row" style="margin-bottom:0">
        <label style="font-size:13px;color:#888">更新进度</label>
        <div style="display:flex;gap:8px">
          <input type="number" id="detailProgress" value="${data.progress || 0}" min="0" max="100" style="flex:1">
          <button onclick="saveDetailProgress('${name}')" class="btn-primary" style="width:80px;padding:11px;font-size:13px;margin:0">保存</button>
        </div>
      </div>
    </div>

    <div class="section-title">📋 消费记录</div>
    <div id="detailRecordsList"></div>
  `;
  renderDetailRecords(name, data);
}

function saveDetailProgress(name) {
  const val = parseInt(document.getElementById('detailProgress').value) || 0;
  const db = getDB();
  if (db[name]) {
    db[name].progress = Math.min(100, Math.max(0, val));
    saveDB(db);
    // 回显新值
    document.getElementById('detailProgress').value = db[name].progress;
    document.querySelector('#viewCustomerDetail .progress-bar').style.width = db[name].progress + '%';
    document.querySelector('#viewCustomerDetail .progress-bar').parentElement.nextElementSibling.textContent = db[name].progress + '%';
    showToast('✅ 进度已更新');
  }
}

function renderDetailRecords(name, data) {
  const container = document.getElementById('detailRecordsList');
  const sorted = [...data.records].reverse();
  if (sorted.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">📭</div><p>暂无记录</p></div>';
    return;
  }
  let html = '';
  for (const r of sorted) {
    html += `
      <div class="record-edit-item">
        <div class="rei-info">
          <div class="rei-date">${r.date}</div>
          <div class="rei-product">${r.product}</div>
          <div class="rei-amount">¥${parseFloat(r.amount || 0).toFixed(2)}</div>
          ${r.balance ? `<div class="rei-balance">${r.balance}</div>` : ''}
          ${r.note ? `<div style="font-size:11px;color:#bbb;margin-top:2px">${r.note}</div>` : ''}
        </div>
        <div class="rei-actions">
          <button class="edit-btn" onclick="editRecord('${name}', ${r.id})">✏️</button>
          <button class="del-btn" onclick="delRecord('${name}', ${r.id}); renderDetailRecords('${name}', getDB()['${name}'] || {records:[]})">🗑️</button>
        </div>
      </div>
    `;
  }
  container.innerHTML = html;
}

// ========== 模态框 ==========
function openModal(title, content) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalContent').innerHTML = content;
  document.getElementById('modalOverlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// 点击遮罩关闭
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ========== 初始化 ==========
document.getElementById('fDate').value = todayStr();
</script>
</body>
</html>
