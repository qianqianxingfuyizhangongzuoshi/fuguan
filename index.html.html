<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>倩倩幸福驿站工作室 - 会员管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            min-height: 100vh;
            padding: 15px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* 登录页面 */
        .login-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 90vh; }
        .login-box { background: white; border-radius: 20px; padding: 35px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
        .login-box h1 { color: #333; font-size: 20px; margin-bottom: 8px; }
        .login-box p { color: #666; font-size: 13px; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; text-align: center; margin-bottom: 15px; transition: border-color 0.3s; }
        .login-box input:focus { outline: none; border-color: #11998e; }
        .login-box button { width: 100%; padding: 14px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
        .login-box button:hover { transform: scale(1.02); }
        .login-error { color: #e74c3c; font-size: 13px; margin-top: 12px; display: none; }
        
        .login-tabs { display: flex; margin-bottom: 20px; gap: 10px; }
        .login-tab { flex: 1; padding: 10px; background: #f0f0f0; border: none; border-radius: 8px; font-size: 13px; cursor: pointer; color: #666; transition: all 0.3s; }
        .login-tab.active { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        
        /* 主页面 */
        .main-page { display: none; }
        .header { background: white; border-radius: 15px; padding: 12px 15px; margin-bottom: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); text-align: center; }
        .header h1 { color: #333; font-size: 16px; margin-bottom: 3px; }
        .header p { color: #666; font-size: 11px; }
        .header .user-badge { background: #11998e; color: white; padding: 3px 12px; border-radius: 20px; font-size: 11px; display: inline-block; margin-top: 5px; }
        
        /* 统计面板 */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
        .stat-card { background: white; border-radius: 12px; padding: 12px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .stat-card .number { font-size: 22px; font-weight: bold; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card .label { color: #666; font-size: 11px; margin-top: 4px; }
        .stat-card.warning .number { background: linear-gradient(135deg, #f12711 0%, #f5af19 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        /* 生日提醒 */
        .birthday-alert { background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%); color: white; border-radius: 12px; padding: 12px; margin-bottom: 12px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .birthday-alert .title { font-size: 14px; font-weight: bold; margin-bottom: 5px; }
        .birthday-alert .names { font-size: 12px; opacity: 0.95; }
        
        /* 导航栏 */
        .nav-tabs { display: flex; background: white; border-radius: 12px; overflow: hidden; margin-bottom: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .nav-tab { flex: 1; padding: 10px 3px; text-align: center; cursor: pointer; transition: all 0.3s; font-size: 10px; color: #666; }
        .nav-tab.active { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .nav-tab .icon { font-size: 20px; display: block; margin-bottom: 2px; }
        
        /* 内容区 */
        .content-area { background: white; border-radius: 15px; padding: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); min-height: 250px; }
        .section-title { font-size: 15px; color: #333; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid #f0f0f0; }
        
        /* 会员卡片 */
        .member-card { border: 2px solid #e0e0e0; border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; transition: all 0.3s; }
        .member-card:hover { border-color: #11998e; background: #f8fff8; }
        .member-card .name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .member-card .name { font-size: 15px; font-weight: bold; color: #333; }
        .member-card .level { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 2px 8px; border-radius: 15px; font-size: 10px; }
        .member-card .info-row { font-size: 11px; color: #666; margin-bottom: 4px; }
        .member-card .stats-row { display: flex; gap: 10px; margin-top: 8px; font-size: 11px; }
        .member-card .stats-row span { color: #11998e; font-weight: bold; }
        .member-card .birthday-badge { background: #feca57; color: #333; padding: 2px 8px; border-radius: 10px; font-size: 10px; margin-left: 5px; }
        
        /* 活跃度标签 */
        .activity-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; margin-left: 5px; }
        .activity-tag.active { background: #38ef7d; color: #333; }
        .activity-tag.normal { background: #74b9ff; color: white; }
        .activity-tag.dormant { background: #fdcb6e; color: #333; }
        .activity-tag.lost { background: #e74c3c; color: white; }
        .activity-tag.new { background: #a29bfe; color: white; }
        
        /* 详情页面 */
        .detail-header { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
        .detail-header h2 { font-size: 18px; margin-bottom: 5px; }
        .detail-header p { font-size: 12px; opacity: 0.9; }
        .detail-info { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; font-size: 12px; color: #666; margin-bottom: 12px; background: #f8f8f8; padding: 10px; border-radius: 8px; }
        
        /* 拿货记录 */
        .record-item { padding: 10px; border-left: 3px solid #11998e; background: #f8fff8; border-radius: 0 8px 8px 0; margin-bottom: 8px; }
        .record-item .record-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 11px; color: #999; }
        .record-item .record-product { font-size: 13px; color: #333; font-weight: bold; margin-bottom: 5px; }
        .record-item .record-detail { font-size: 11px; color: #666; }
        .record-item .record-total { font-size: 15px; color: #e74c3c; font-weight: bold; text-align: right; margin-top: 5px; }
        
        /* 顾客端页面 */
        .customer-info-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; text-align: center; }
        .customer-info-card .phone { font-size: 18px; margin-bottom: 5px; }
        .customer-info-card .name { font-size: 14px; opacity: 0.9; }
        .customer-amount-card { background: #fff9e6; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
        .customer-amount-row { display: flex; justify-content: space-between; font-size: 13px; color: #666; margin-bottom: 8px; }
        .customer-amount-row:last-child { font-size: 18px; font-weight: bold; color: #e74c3c; border-top: 1px dashed #ddd; padding-top: 10px; margin-top: 10px; margin-bottom: 0; }
        
        /* 分析卡片 */
        .analysis-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .analysis-card { background: #f8f8f8; padding: 12px; border-radius: 10px; text-align: center; }
        .analysis-card .icon { font-size: 24px; margin-bottom: 5px; }
        .analysis-card .count { font-size: 24px; font-weight: bold; color: #11998e; }
        .analysis-card .label { font-size: 11px; color: #666; margin-top: 3px; }
        
        /* 表单 */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; color: #333; margin-bottom: 4px; font-weight: 500; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 13px; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #11998e; }
        .form-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .btn { width: 100%; padding: 12px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; transition: transform 0.2s; }
        .btn:hover { transform: scale(1.02); }
        .btn-secondary { background: #f0f0f0; color: #333; margin-top: 8px; }
        .btn-danger { background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%); margin-top: 5px; }
        
        /* 空状态 */
        .empty-state { text-align: center; padding: 30px; color: #999; }
        .empty-state .icon { font-size: 40px; margin-bottom: 10px; }
        
        /* 弹窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; border-radius: 15px; padding: 18px; width: 95%; max-width: 380px; max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .modal-header h3 { color: #333; font-size: 15px; }
        .modal-close { background: none; border: none; font-size: 22px; cursor: pointer; color: #999; }
        
        /* 退出按钮 */
        .logout-btn { display: inline-block; padding: 4px 10px; background: #f0f0f0; color: #666; border-radius: 15px; font-size: 10px; cursor: pointer; margin-top: 5px; }
        .logout-btn:hover { background: #e0e0e0; }
        
        /* 统计图表 */
        .mini-chart { display: flex; align-items: flex-end; gap: 3px; height: 30px; margin-top: 8px; }
        .mini-chart .bar { width: 20px; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); border-radius: 3px 3px 0 0; }
    </style>
</head>
<body>
    <div class="container">
        <!-- 登录页面 -->
        <div class="login-page" id="loginPage">
            <div class="login-box">
                <h1>🏠 倩倩幸福驿站工作室</h1>
                <p>会员产品拿货记录系统</p>
                
                <div class="login-tabs">
                    <button class="login-tab active" onclick="switchLoginTab('admin')">🔐 店主入口</button>
                    <button class="login-tab" onclick="switchLoginTab('customer')">📱 顾客入口</button>
                </div>
                
                <!-- 店主登录 -->
                <div id="adminLogin">
                    <input type="password" id="adminPassword" placeholder="请输入店主密码" maxlength="20">
                    <button onclick="adminLogin()">登 录</button>
                    <p class="login-error" id="adminError">密码错误，请重新输入</p>
                </div>
                
                <!-- 顾客登录 -->
                <div id="customerLogin" style="display:none;">
                    <input type="tel" id="customerPhone" placeholder="请输入您的手机号" maxlength="11">
                    <button onclick="customerLogin()">登 录</button>
                    <p class="login-error" id="customerError">未找到此手机号，请联系店主添加</p>
                </div>
            </div>
        </div>
        
        <!-- 店主主页面 -->
        <div class="main-page" id="adminPage">
            <div class="header">
                <h1>🏠 倩倩幸福驿站工作室</h1>
                <p>店主管理后台</p>
                <span class="user-badge">👑 店主</span>
                <span class="logout-btn" onclick="logout()">退出登录</span>
            </div>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="number" id="totalMembers">0</div>
                    <div class="label">会员总数</div>
                </div>
                <div class="stat-card">
                    <div class="number" id="totalRecordsNum">0</div>
                    <div class="label">拿货记录</div>
                </div>
                <div class="stat-card warning">
                    <div class="number" id="totalAmount">¥0</div>
                    <div class="label">累计销售额</div>
                </div>
            </div>
            
            <!-- 生日提醒 -->
            <div class="birthday-alert" id="birthdayAlert" style="display:none;">
                <div class="title">🎂 今日生日提醒</div>
                <div class="names" id="birthdayNames"></div>
            </div>
            
            <div class="nav-tabs">
                <div class="nav-tab active" onclick="switchTab('members')"><span class="icon">👥</span>会员列表</div>
                <div class="nav-tab" onclick="switchTab('addMember')"><span class="icon">➕</span>添加会员</div>
                <div class="nav-tab" onclick="switchTab('addRecord')"><span class="icon">📦</span>录入拿货</div>
                <div class="nav-tab" onclick="switchTab('analysis')"><span class="icon">📊</span>数据分析</div>
            </div>
            
            <div class="content-area" id="contentArea"></div>
        </div>
        
        <!-- 顾客页面 -->
        <div class="main-page" id="customerPage">
            <div class="header">
                <h1>🏠 倩倩幸福驿站</h1>
                <p>欢迎查看您的拿货记录</p>
                <span class="logout-btn" onclick="logout()">退出登录</span>
            </div>
            
            <div class="content-area" id="customerContent"></div>
        </div>
    </div>
    
    <!-- 添加会员弹窗 -->
    <div class="modal" id="addMemberModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加新会员</h3>
                <button class="modal-close" onclick="closeModal('addMemberModal')">&times;</button>
            </div>
            <div class="form-group"><label>姓名 *</label><input type="text" id="memberName" placeholder="请输入会员姓名"></div>
            <div class="form-group"><label>手机号 *</label><input type="tel" id="memberPhone" placeholder="请输入手机号" maxlength="11"></div>
            <div class="form-group"><label>地址</label><input type="text" id="memberAddress" placeholder="请输入住址"></div>
            <div class="form-group"><label>生日</label><input type="date" id="memberBirthday"></div>
            <div class="form-row">
                <div class="form-group"><label>养森团队</label><input type="text" id="memberYangsenTeam" placeholder="养森团队"></div>
                <div class="form-group"><label>会员级别</label><input type="text" id="memberLevel" placeholder="如：5盒"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>上级老师</label><input type="text" id="memberTeacher" placeholder="上级老师"></div>
                <div class="form-group"><label>会员编号</label><input type="text" id="memberNo" placeholder="编号"></div>
            </div>
            <div class="form-group"><label>跃莱团队</label><input type="text" id="memberYuelaiTeam" placeholder="跃莱团队"></div>
            <button class="btn" onclick="addMember()">添加会员</button>
            <button class="btn btn-secondary" onclick="closeModal('addMemberModal')">取消</button>
        </div>
    </div>
    
    <!-- 添加拿货记录弹窗 -->
    <div class="modal" id="addRecordModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>录入拿货记录</h3>
                <button class="modal-close" onclick="closeModal('addRecordModal')">&times;</button>
            </div>
            <div class="form-group"><label>选择会员 *</label><select id="recordMember"><option value="">请选择会员</option></select></div>
            <div class="form-group"><label>时间</label><input type="date" id="recordDate"></div>
            <div class="form-group"><label>产品名称</label><input type="text" id="recordProduct" placeholder="如：瘦瘦包"></div>
            <div class="form-group"><label>产品单价（元）</label><input type="number" id="recordPrice" placeholder="单价" min="0"></div>
            <div class="form-row">
                <div class="form-group"><label>数量-养森（盒）</label><input type="number" id="recordYangsenQty" placeholder="养森数量" min="0" value="0"></div>
                <div class="form-group"><label>数量-跃莱（盒）</label><input type="number" id="recordYuelaiQty" placeholder="跃莱数量" min="0" value="0"></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>金额-养森（元）</label><input type="number" id="recordYangsenAmount" placeholder="养森金额" min="0" value="0"></div>
                <div class="form-group"><label>金额-跃莱（元）</label><input type="number" id="recordYuelaiAmount" placeholder="跃莱金额" min="0" value="0"></div>
            </div>
            <div class="form-group"><label>票码</label><input type="text" id="recordTicket" placeholder="票据编码"></div>
            <button class="btn" onclick="addRecord()">确认录入</button>
            <button class="btn btn-secondary" onclick="closeModal('addRecordModal')">取消</button>
        </div>
    </div>

    <script>
        // 数据初始化
        const ADMIN_PASSWORD = '696969';
        let members = JSON.parse(localStorage.getItem('fuguan_members')) || [];
        let records = JSON.parse(localStorage.getItem('fuguan_records')) || [];
        let currentTab = 'members';
        let loginType = 'admin';
        let currentCustomerId = null;
        
        // 切换登录方式
        function switchLoginTab(type) {
            loginType = type;
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('adminLogin').style.display = type === 'admin' ? 'block' : 'none';
            document.getElementById('customerLogin').style.display = type === 'customer' ? 'block' : 'none';
            
            document.getElementById('adminError').style.display = 'none';
            document.getElementById('customerError').style.display = 'none';
        }
        
        // 店主登录
        function adminLogin() {
            const pwd = document.getElementById('adminPassword').value;
            if (pwd === ADMIN_PASSWORD) {
                sessionStorage.setItem('fuguan_admin', 'true');
                showAdminPage();
            } else {
                document.getElementById('adminError').style.display = 'block';
            }
        }
        
        // 顾客登录
        function customerLogin() {
            const phone = document.getElementById('customerPhone').value.trim();
            const member = members.find(m => m.phone === phone);
            
            if (member) {
                sessionStorage.setItem('fuguan_customer', member.id);
                currentCustomerId = member.id;
                showCustomerPage(member);
            } else {
                document.getElementById('customerError').style.display = 'block';
            }
        }
        
        // 退出登录
        function logout() {
            sessionStorage.removeItem('fuguan_admin');
            sessionStorage.removeItem('fuguan_customer');
            document.getElementById('adminPage').style.display = 'none';
            document.getElementById('customerPage').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
            document.getElementById('customerPhone').value = '';
        }
        
        // 显示店主页面
        function showAdminPage() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'block';
            document.getElementById('customerPage').style.display = 'none';
            
            updateStats();
            checkBirthday();
            switchTab('members');
        }
        
        // 显示顾客页面
        function showCustomerPage(member) {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminPage').style.display = 'none';
            document.getElementById('customerPage').style.display = 'block';
            
            renderCustomerView(member);
        }
        
        // 更新统计
        function updateStats() {
            document.getElementById('totalMembers').textContent = members.length;
            document.getElementById('totalRecordsNum').textContent = records.length;
            
            const total = records.reduce((sum, r) => sum + parseFloat(r.yangsenAmount || 0) + parseFloat(r.yuelaiAmount || 0), 0);
            document.getElementById('totalAmount').textContent = '¥' + Math.round(total);
        }
        
        // 检查生日
        function checkBirthday() {
            const today = new Date();
            const todayMonth = today.getMonth() + 1;
            const todayDay = today.getDate();
            
            const birthdayMembers = members.filter(m => {
                if (!m.birthday) return false;
                const bDate = new Date(m.birthday);
                return bDate.getMonth() + 1 === todayMonth && bDate.getDate() === todayDay;
            });
            
            const alertDiv = document.getElementById('birthdayAlert');
            const namesDiv = document.getElementById('birthdayNames');
            
            if (birthdayMembers.length > 0) {
                alertDiv.style.display = 'block';
                namesDiv.textContent = birthdayMembers.map(m => m.name).join('、') + ' 🎉';
            } else {
                alertDiv.style.display = 'none';
            }
        }
        
        // 切换标签
        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('#adminPage .nav-tab').forEach(t => t.classList.remove('active'));
            event.target.closest('.nav-tab').classList.add('active');
            
            const content = document.getElementById('contentArea');
            
            switch(tab) {
                case 'members': renderMembers(); break;
                case 'addMember': renderAddMember(); break;
                case 'addRecord': renderAddRecord(); break;
                case 'analysis': renderAnalysis(); break;
            }
        }
        
        // 计算活跃度（流失：70天没拿货）
        function getActivityStatus(member) {
            const memberRecords = records.filter(r => r.memberId === member.id);
            if (memberRecords.length === 0) return 'lost';
            
            const lastRecord = memberRecords.sort((a, b) => new Date(b.date) - new Date(a.date))[0];
            const lastDate = new Date(lastRecord.date);
            const now = new Date();
            const daysSince = Math.floor((now - lastDate) / (1000 * 60 * 60 * 24));
            
            // 加入时间判断
            const joinDate = new Date(member.createdAt);
            const daysSinceJoin = Math.floor((now - joinDate) / (1000 * 60 * 60 * 24));
            
            if (daysSinceJoin <= 30) return 'new';
            if (daysSince <= 30) return 'active';
            if (daysSince <= 70) return 'normal';
            if (daysSince <= 120) return 'dormant';
            return 'lost';
        }
        
        // 获取活跃度标签
        function getActivityLabel(status) {
            const labels = {
                new: { text: '新加入', class: 'new' },
                active: { text: '活跃', class: 'active' },
                normal: { text: '正常', class: 'normal' },

        // 渲染数据分析

            const content = document.getElementById('contentArea');

            members.forEach(m => {

                statusCount[status]++;
            });
            
            // 本月新增
            const now = new Date();
            const thisMonth = now.getMonth() + 1;
            const thisYear = now.getFullYear();
            const newThisMonth = members.filter(m => {
                const d = new Date(m.createdAt);
                return d.getMonth() + 1 === thisMonth && d.getFullYear() === thisYear;
            }).length;
            
            // 本月销售额
            const monthRecords = records.filter(r => {
                const d = new Date(r.date);
                return d.getMonth() + 1 === thisMonth && d.getFullYear() === thisYear;
            });
            const monthTotal = monthRecords.reduce((sum, r) => sum + parseFloat(r.yangsenAmount || 0) + parseFloat(r.yuelaiAmount || 0), 0);
            
            // 即将生日（7天内）
            const upcomingBirthday = members.filter(m => {
                if (!m.birthday) return false;
                const bDate = new Date(m.birthday);
                const thisYearBirthday = new Date(thisYear, bDate.getMonth(), bDate.getDate());

                return diffDays >= 0 && diffDays <= 7;
            });
            
            let html = `

                        <div style="font-size:10px;color:#fff;">流失</div>

                ticket: document.getElementById('pageRecordTicket').value.trim()
            };
            
            records.push(record);
            localStorage.setItem('fuguan_records', JSON.stringify(records));
            
            ['pageRecordMember', 'pageRecordProduct', 'pageRecordPrice', 'pageRecordYangsenQty', 'pageRecordYuelaiQty', 'pageRecordYangsenAmount', 'pageRecordYuelaiAmount', 'pageRecordTicket'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.value = el.type === 'number' ? '0' : '';
            });
            
            updateStats();
            renderMembers();
            alert('拿货记录添加成功！');
        }
        
        // 删除会员
        function deleteMember(index) {
            if (!confirm('确定删除此会员吗？')) return;
            
            const member = members[index];
            records = records.filter(r => r.memberId !== member.id);
            localStorage.setItem('fuguan_records', JSON.stringify(records));
            
            members.splice(index, 1);
            localStorage.setItem('fuguan_members', JSON.stringify(members));
            
            updateStats();
            checkBirthday();
            renderMembers();
            alert('会员已删除');
        }
        
        // 打开弹窗
        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.add('show');
            
            if (modalId === 'addRecordModal') {
                const select = document.getElementById('recordMember');
                select.innerHTML = '<option value="">请选择会员</option>' + members.map(m => `<option value="${m.id}">${m.name} (${m.phone || '无电话'})</option>`).join('');
                document.getElementById('recordDate').value = new Date().toISOString().split('T')[0];
            }
        }
        
        // 关闭弹窗
        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('show');
        }
        
        // 格式化日期
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }
        
        // 点击背景关闭弹窗
        window.onclick = function(event) {
            if (event.target.classList.contains('modal')) {
                event.target.classList.remove('show');
            }
        }
        
        // 回车登录
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('adminPassword').addEventListener('keypress', e => { if (e.key === 'Enter') adminLogin(); });
            document.getElementById('customerPhone').addEventListener('keypress', e => { if (e.key === 'Enter') customerLogin(); });
            
            // 检查登录状态
            if (sessionStorage.getItem('fuguan_admin') === 'true') {
                showAdminPage();
            } else if (sessionStorage.getItem('fuguan_customer')) {
                const member = members.find(m => m.id === parseInt(sessionStorage.getItem('fuguan_customer')));
                if (member) {
                    currentCustomerId = member.id;
                    showCustomerPage(member);
                }
            }
        });
    </script>
</body>
</html>
